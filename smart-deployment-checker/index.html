function smoke(html){return new Promise(res=>{const f=document.createElement('iframe');f.sandbox='allow-scripts';f.style.cssText='position:absolute;width:0;height:0;border:0';let err='';const on=e=>{if(e.data&&e.data.sdc&&!err)err=e.data.m||'error'};addEventListener('message',on);const sn='<script>addEventListener("error",e=>parent.postMessage({sdc:1,m:e.message},"*"))<\/script>';f.srcdoc=/<head[^>]*>/i.test(html)?html.replace(/<head[^>]*>/i,m=>m+sn):sn+html;document.body.appendChild(f);setTimeout(()=>{removeEventListener('message',on);f.remove();res(err)},2500)})}
async function analyze(html,size){const bad=[...html.matchAll(/<script[^>]+src=["']https?:\/\/([^\/"']+)/gi)].map(m=>m[1]).filter(h=>!OKH.includes(h));const err=await smoke(html);return[['test_entry_document_has_body',/<body/i.test(html),'No <body> element found in index.html'],['test_external_scripts_allowed',!bad.length,'Scripts blocked on host: '+bad.join(', ')],['test_bundle_within_size_limit',size<1.5e6,'Bundle is '+(size/1e6).toFixed(1)+' MB; the limit is 1.5 MB'],['test_app_boots_without_js_errors',!err,'Uncaught error: '+err]].map(x=>({n:x[0],d:x[0].slice(5).replace(/_/g,' '),pass:x[1],e:'AssertionError: '+x[2]}))}
async function pick(f){if(!f)return;let html,files=1;try{if(/\.zip$/i.test(f.name)){const z=await JSZip.loadAsync(f),n=Object.keys(z.files).filter(k=>!z.files[k].dir);files=n.length;const ix=n.filter(k=>/(^|\/)index\.html$/.test(k)).sort((a,b)=>a.length-b.length)[0],b=ix.replace(/index\.html$/,'');html=await z.files[ix].async('string');const rd=async u=>{if(/^(https?:)?\/\//.test(u))return null;const p=b+u.replace(/^\.?\//,'').split('?')[0];return z.files[p]?z.files[p].async('string'):null};for(const m of [...html.matchAll(/<script([^>]*)src="([^"]+)"([^>]*)><\/script>/g)]){const js=await rd(m[2]);if(js!=null)html=html.replace(m[0],()=>'<script'+(/module/.test(m[1]+m[3])?' type="module"':'')+'>'+js.replace(/<\/script/gi,'<\\/script')+'</scr'+'ipt>')}for(const m of [...html.matchAll(/<link[^>]*href="([^"]+\.css[^"]*)"[^>]*>/g)]){const css=await rd(m[1]);if(css!=null)html=html.replace(m[0],()=>'<style>'+css+'</style>')}}else html=await f.text()}catch(e){toast('Could not read that file. Upload an .html file or a zipped build containing index.html.');return}
html=html.replace(/https?:\/\/unpkg\.com\//g,'https://cdn.jsdelivr.net/npm/');const size=new Blob([html]).size,slug=f.name.replace(/\.[^.]+$/,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'app';toast('Analyzing '+f.name+'…');const tests=await analyze(html,size);S.app={name:slug,html,kind:/react/i.test(html)?'React':'HTML',size,files,tests};S.cfg.img=slug;S.tests=[];save();render()}
async function publishApp(r){const db=await claude.use('db');if(!db)throw new Error('storage is unavailable');const id=rid()+rid(),ch=S.app.html.match(/[\s\S]{1,70000}/g)||[''];log('Uploading '+ch.length+' file part(s) to hosting',r);for(let i=0;i<ch.length;i++)await db.doc('apps/'+id+'/parts/p'+i).set({i,s:ch[i]});await db.doc('apps/'+id).set({name:S.app.name,n:ch.length,kind:S.app.kind,t:Date.now()});const m=await db.doc('apps/'+id).get();if(!m.exists)throw new Error('the upload could not be read back');let len=0;for(let i=0;i<m.data().n;i++)len+=(await db.doc('apps/'+id+'/parts/p'+i).get()).data().s.length;if(len!=S.app.html.length)throw new Error('verification failed: stored size does not match');r.url=ART+'#app-'+id;S.apps.unshift({id,name:S.app.name,url:r.url,t:Date.now(),ver:r.ver})}
async function viewApp(id){document.body.innerHTML='<p style="padding:24px">Loading application…</p>';try{const db=await claude.use('db'),h=await db.doc('apps/'+id).get();if(!h.exists)throw 0;let s='';for(let i=0;i<h.data().n;i++)s+=(await db.doc('apps/'+id+'/parts/p'+i).get()).data().s;document.body.innerHTML='<iframe sandbox="allow-scripts allow-forms allow-popups allow-modals" style="position:fixed;inset:0;width:100%;height:100%;border:0"></iframe>';document.querySelector('iframe').srcdoc=s}catch(e){document.body.innerHTML='<p style="padding:24px">This application is not available. Sign in to claude.ai and open the link again.</p>'}}
const upl=()=>`<section class="c"><div class="ch"><h3>Application source</h3></div>${S.app?`<div class="kv" style="margin-bottom:12px"><span>Application</span><b>${S.app.name}</b><span>Type</span><b>${S.app.kind}</b><span>Files · size</span><b>${S.app.files} · ${Math.round(S.app.size/1024)} KB</b></div>`:'<p class="sub" style="margin:0 0 12px">Upload a single HTML file or a zipped React build (the folder containing index.html). Every deployment gets a live URL.</p>'}<input type="file" accept=".html,.htm,.zip" ${S.busy?'disabled':''} onchange="pick(this.files[0])"></section>`;
const live=()=>S.apps.length?`<section class="c"><h3 style="margin-bottom:12px">Live applications</h3>${S.apps.slice(0,5).map(a=>`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--line)"><span><b>${a.name}</b> v${a.ver}</span><span><a class="l" href="${a.url}" target="_blank" rel="noopener">${a.url}</a> <button onclick="navigator.clipboard.writeText('${a.url}');toast('Link copied')">Copy link</button></span></div>`).join('')}</section>`:'';
const P={};

return`<h2>Overview</h2><p class="sub">Health and delivery status for ${S.env}.</p><div class="cards">${[['Total deployments',R.length,'all environments'],['Successful deployments',ok,Math.round(ok/R.length*100)+'% success rate'],['Failed test runs',R.filter(r=>r.s[1]=='Failed').length,'deployments blocked by tests'],['Application health',bd(h.ok?'Healthy':'Unhealthy'),'HTTP '+h.code+' · '+h.ms+' ms'],['Latest build',bd(lb.s[2]),S.cfg.img+':'+lb.ver]].map(x=>`<div class="k"><small>${x[0]}</small><b>${x[1]}</b><em>${x[2]}</em></div>`).join('')}</div>
<section class="c"><div class="ch"><h3>Deployment pipeline · ${c.id} · v${c.ver}</h3><button class="p" ${S.busy?'disabled':''} onclick="startDeploy()">${S.busy?'Pipeline running…':'Deploy now'}</button></div>${pipe(c.s)}${c.err?`<div class="err">${c.err}</div>`:''}</section>
<section class="c"><h3 style="margin-bottom:14px">Recent activity</h3>${tbl(5)}</section>`};

let o='No test run yet. Press Run tests to execute the suite.';if(t.length){o='============ test session starts ============\nplatform linux -- Python 3.11, pytest-8.2\ncollected '+t.length+' items\n\ntests/test_app.py '+t.map(x=>x.st=='Failed'?'F':x.st=='Passed'?'.':' ').join('')+'\n';t.filter(x=>x.st=='Failed').forEach(x=>o+='\n___ '+x.n+' ___\n\n'+x.err+'\n');if(S.tdur)o+='\n=== '+(n('Failed')?n('Failed')+' failed, ':'')+n('Passed')+' passed in '+S.tdur+'s ==='}
return`<h2>Automated Tests</h2><p class="sub">Pytest suite for the Flask application. A failing test blocks the deployment.</p><div class="cards">${[['Total tests',TL().length],['Passed',n('Passed')],['Failed',n('Failed')],['Skipped',0],['Duration',S.tdur?S.tdur+'s':'–']].map(x=>`<div class="k"><small>${x[0]}</small><b>${t.length||x[0]=='Total tests'?x[1]:'–'}</b></div>`).join('')}</div>
<section class="c"><div class="ch"><h3>Test results</h3><button class="p" ${S.busy?'disabled':''} onclick="runTests()">${S.busy?'Running…':'Run tests'}</button></div><div class="tw"><table><thead><tr><th>Test</th><th>Result</th><th>Time</th><th></th></tr></thead><tbody>${(t.length?t:TL().map(x=>({...x,st:'Waiting',ms:0}))).map(x=>`<tr class="row" onclick="S.open=S.open=='${x.n}'?null:'${x.n}';render()"><td><b>${x.n}</b></td><td>${bd(x.st)}</td><td>${x.ms?x.ms+' ms':'–'}</td><td><a class="l">${S.open==x.n?'Hide':'Details'}</a></td></tr>${S.open==x.n?`<tr class="det"><td colspan="4"><p style="margin:0 0 8px;color:var(--mut)">${x.d}</p>${x.err?`<pre>${x.err.replace(/</g,'&lt;')}</pre>`:'<span class="mono">No assertion errors.</span>'}</td></tr>`:''}`).join('')}</tbody></table></div></section>
<section class="c"><h3 style="margin-bottom:12px">Console output</h3><pre>${o.replace(/</g,'&lt;')}</pre></section>`};
P.deploy=()=>{const c=S.cur||S.runs[0],ok=pr(),l=S.logs.slice(-14);
return`<h2>Deployments</h2><p class="sub">Tests run first. Docker build and rollout only start when every test passes.</p>${live()}${upl()}<div class="g2"><section class="c"><h3 style="margin-bottom:14px">Release configuration</h3><div class="kv"><span>Application</span><b>${S.app?S.app.name:'smart-checker'}</b><span>Version</span><b>v${S.ver} · a3f9c21</b><span>Environment</span><b>${S.env}</b><span>Docker image</span><b>${S.cfg.img}:${S.ver}</b><span>Namespace</span><b>${S.ns}</b><span>Replicas</span><b>${S.cfg.rep}</b><span>Status</span><b>${bd(S.busy?'Running':c.status)}</b><span>Pods</span><b>${ok}/${S.pods.length} ready</b><span>Last deployed</span><b>${fd(S.at)}</b></div><button class="p" style="width:100%;margin-top:18px" ${S.busy?'disabled':''} onclick="startDeploy()">${S.busy?'Deploying…':'Deploy application'}</button></section>
<div><section class="c"><div class="ch"><h3>${c.id} · pipeline</h3>${bd(S.busy?'Running':c.status)}</div>${pipe(c.s)}${c.status=='Blocked'?`<div class="err"><b>Deployment blocked.</b> ${c.err}</div>`:c.status=='Failed'?`<div class="err">${c.err}</div>`:c.status=='Succeeded'?`<div class="okm"><b>Deployment successful.</b> Tests passed, image built, all pods are ready and the application is live.${c.url?`<br><a class="l" href="${c.url}" target="_blank" rel="noopener">${c.url}</a> <button onclick="navigator.clipboard.writeText('${c.url}');toast('Link copied')">Copy link</button>`:''}</div>`:''}</section><section class="c"><h3 style="margin-bottom:12px">Live output</h3><pre>${l.map(x=>ft(x.t)+'  '+x.m.replace(/</g,'&lt;')).join('\n')}</pre></section></div></div>`};
P.docker=()=>{const d=S.docker;return`<h2>Docker Builds</h2><p class="sub">Container image build for smart-checker.</p><div class="cards">${[['Image',S.cfg.img+':'+(d.tag||S.ver)],['Status',bd(d.status)],['Duration',d.dur?d.dur+'s':'–'],['Last successful build',d.last?age(d.last)+' ago':'–']].map(x=>`<div class="k"><small>${x[0]}</small><b style="font-size:18px">${x[1]}</b></div>`).join('')}</div>
<div class="g2"><section class="c"><div class="ch"><h3>Build stages</h3></div>${BS.map((s,i)=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><span>${s}</span>${bd(d.stage>i?'Passed':d.stage==i&&d.status=='Running'?'Running':'Waiting')}</div>`).join('')}<button class="p" style="width:100%;margin-top:16px" ${S.busy?'disabled':''} onclick="rebuild()">Build again</button></section>
<section class="c"><h3 style="margin-bottom:12px">Build log</h3><pre>${d.logs.join('\n').replace(/</g,'&lt;')}</pre></section></div>`};
P.k8s=()=>{const ok=pr(),n=S.pods.length;return`<h2>Kubernetes</h2><p class="sub">Cluster minikube · ${bd('Ready')}</p><div class="tools"><select onchange="S.ns=this.value;render()">${opts(['default','staging','production'],S.ns)}</select><button onclick="toast('Status refreshed');render()">Refresh status</button></div>
<div class="g2"><section class="c"><h3 style="margin-bottom:14px">smart-deployment</h3><div class="kv"><span>Desired / available</span><b>${n} / ${ok}</b><span>Container image</span><b>${S.cfg.img}:${S.ver}</b><span>Label</span><b>app=smart-checker</b><span>Container port</span><b>5000</b></div><h3 style="margin:20px 0 12px">smart-checker-service</h3><div class="kv"><span>Type</span><b>NodePort</b><span>Port mapping</span><b>5000:30080/TCP</b><span>Selector</span><b>app=smart-checker</b></div></section>
<section class="c"><h3 style="margin-bottom:12px">Pods</h3><div class="tw"><table><thead><tr><th>Name</th><th>Status</th><th>Ready</th><th>Restarts</th><th>Age</th><th></th></tr></thead><tbody>${S.pods.map(p=>`<tr><td class="mono">${p.n}</td><td>${bd(p.st,1)}</td><td>${p.rdy}</td><td>${p.rs}</td><td>${age(p.t)}</td><td><a class="l" onclick="S.podLog='${p.n}';render()">View logs</a></td></tr>`).join('')}</tbody></table></div></section></div>
${S.podLog?`<section class="c"><div class="ch"><h3>Logs · ${S.podLog}</h3><button onclick="S.podLog=null;render()">Close</button></div><pre>[2026-10-30 10:12:01] [1] [INFO] Starting gunicorn 22.0.0\n[2026-10-30 10:12:01] [1] [INFO] Listening at: http://0.0.0.0:5000\n[2026-10-30 10:12:02] [7] [INFO] Booting worker with pid: 7\n127.0.0.1 "GET /health HTTP/1.1" 200 21\n127.0.0.1 "GET / HTTP/1.1" 200 38</pre></section>`:''}`};
P.health=()=>{const h=S.health[0],v=S.health.slice(0,14).reverse(),mx=Math.max(...v.map(x=>x.ms),1);return`<h2>Application Health</h2><p class="sub">Live checks against the application endpoints.</p><div class="cards">${[['Status',bd(h.ok?'Healthy':'Unhealthy')],['HTTP response',h.code],['Response time',h.ms+' ms'],['Last check',ft(h.t)]].map(x=>`<div class="k"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div>
